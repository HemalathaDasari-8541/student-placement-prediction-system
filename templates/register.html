<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="container">


    <h1>

        Student Placement Prediction System

    </h1>


    <h2>

        Create Account

    </h2>


    <form action="/register"
          method="POST">


        <label>

            Full Name

        </label>


        <input

            type="text"

            id="fullName"

            name="fullname"

            placeholder="Enter your full name"

            required>


        <label>

            Email

        </label>


        <input

            type="email"

            id="email"

            name="email"

            placeholder="Enter your email"

            required>


        <label>

            Mobile Number

        </label>


        <input

            type="tel"

            id="mobile"

            name="mobile"

            placeholder="Enter your mobile number"

            required>


        <label>

            Password

        </label>


        <input

            type="password"

            id="password"

            name="password"

            placeholder="Create a password"

            required>


        <label>

            Confirm Password

        </label>


        <input

            type="password"

            id="confirmPassword"

            name="confirm_password"

            placeholder="Confirm your password"

            required>


        <br>


        <button type="submit">

            Create Account

        </button>


        <p id="errorMsg"></p>


    </form>


</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
